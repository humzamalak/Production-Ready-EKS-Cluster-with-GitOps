# GitHub Actions Workflow: Terraform Deploy
# Runs Terraform format and validate checks for EKS GitOps infrastructure.
# Plan and apply (which need AWS credentials and the S3 backend) live in
# terraform-plan.yaml and terraform-apply.yaml.

name: "Terraform Deploy"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-staging:
    name: "Terraform Staging"
    runs-on: ubuntu-latest
    # environment labels are not required for validation; remove to avoid lints
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=terraform/environments/aws init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/environments/aws validate -no-color

      # Security scanners can be re-enabled when secrets/repository settings are configured
      # - uses: aquasecurity/tfsec-action@v1.0.3
      # - uses: bridgecrewio/checkov-action@v12

# Notes:
# - This workflow runs fmt/validate without using a remote backend or AWS credentials.
# - Re-enable security scanners and cost estimation once repo secrets are configured.
