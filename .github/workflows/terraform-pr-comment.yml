# GitHub Actions Workflow: PR Comment Automation for Terraform Plans
# Comments the Terraform plan output on pull requests

name: "Terraform PR Comment"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment-plan:
    name: "Comment Terraform Plan"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
    defaults:
      run:
        working-directory: terraform/environments/aws
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        run: terraform plan -input=false -out=plan.out

      - name: Show Terraform Plan
        id: plan
        run: terraform -chdir=terraform/environments/aws show -no-color plan.out > plan.txt
        working-directory: .

      - name: Comment Plan on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: plan.txt

# Notes:
# - This workflow runs on PR events and comments the plan output for reviewers.
# - You can extend this to production or other environments as needed.
