name: ArgoCD Application Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'argo-apps/**'
      - 'scripts/validate.sh'
      - '.github/workflows/validate-applications.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'argo-apps/**'
      - 'scripts/validate.sh'
      - '.github/workflows/validate-applications.yml'

permissions:
  contents: read

jobs:
  validate-applications:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ubuntu-latest ships kubectl and mikefarah/yq, which scripts/validate.sh needs.
    # --dry-run skips the cluster connection check; the apps scope reads files only.
    - name: Validate ArgoCD Applications
      run: |
        echo "🔍 Validating ArgoCD Applications..."
        bash scripts/validate.sh apps --dry-run

    - name: Validate YAML syntax
      run: |
        echo "🔍 Validating YAML syntax..."
        find argo-apps/ -name "*.yaml" -print0 | while IFS= read -r -d '' file; do
          echo "Checking $file..."
          python3 -c "import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))" "$file" || exit 1
        done
